[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioutils"
version = "0.1.0"
description = "Utilities for MScR Project data analysis."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bioutils"]
