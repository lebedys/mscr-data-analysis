[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Install with: pip install -e bioutils -e .
[project]
name = "mscr-analysis"
version = "0.1.0"
description = "Plate-reader, flow-cytometry and genotyping analysis of a genetic circuit library"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "scipy>=1.10",
    "pandas>=3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "FlowCal>=1.3",
    "pillow>=10",
    "jupyter",
    "parasbolv @ git+https://github.com/BiocomputeLab/paraSBOLv.git@1c506cf9a5c7a704f6679282dbedf806346843c5",
]

# notebooks and scripts only; nothing to package
[tool.setuptools]
packages = []
